# Build ONE customer recipe. Called by propagate.yml, once per stale recipe.
# Publishes only on a full check-matrix pass — there is no input that bypasses that.
name: build-recipe
on:
  workflow_call:
    inputs:
      recipe:       { required: true,  type: string }
      base_digest:  { required: true,  type: string }
  workflow_dispatch:
    inputs:
      recipe:       { required: true,  type: string }
      base_digest:  { required: false, type: string, description: 'Leave empty to use the currently published base. There is deliberately no input that skips the check matrix.' }

defaults:
  run:
    shell: bash -euo pipefail {0}

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04     # pinned: ubuntu-latest migrates to 26.04 between 2026-10-19 and 11-19 (D23)
    timeout-minutes: 120
    env:
      # THE RECIPE NAME ARRIVES IN A PULL REQUEST FROM THE INTERNET.
      #
      # `${{ }}` inside a `run:` block is textual substitution performed BEFORE bash sees the script,
      # so every interpolation of an attacker-influenced value is an injection site — a name
      # containing a quote and a semicolon becomes commands. Binding it once to an environment
      # variable here means every step refers to "$RECIPE", which bash treats as data no matter what
      # it contains.
      #
      # The schema constrains the name as well. This is the second layer, because the first one being
      # correct is not something a publish step should have to assume.
      RECIPE: ${RECIPE}
      BASE_DIGEST: ${BASE_DIGEST}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: aarohkandy/auros-base, path: .auros-base }
      # The namespace. `compile` writes the FROM line from auros.config.json and has no literal to
      # fall back on (DECISIONS.md D1), so the control repo has to be here. src/config.ts looks in
      # .auros-meta/ by name. The two repository names on these lines are the bootstrap: a workflow
      # cannot read the namespace file before it has fetched the file that holds it.
      - uses: actions/checkout@v4
        with: { repository: aarohkandy/auros, path: .auros-meta }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: corepack enable && pnpm install --frozen-lockfile

      - name: Validate — a recipe may only ADD
        run: |
          R="customers/${RECIPE}/recipe.yaml"
          echo "::group::validate"
          node dist/cli.js validate "$R"
          echo "::endgroup::"
          echo "::group::explain (this text becomes the PR body and the customer reads it)"
          node dist/cli.js explain "$R" | tee /tmp/explain.txt
          echo "::endgroup::"

      - name: Reclaim disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift 2>/dev/null || true
          sudo docker system prune -af --volumes >/dev/null 2>&1 || true
          df -h /

      - name: Compile, and refuse to proceed if the committed Containerfile has drifted
        id: build
        run: |
          R="customers/${RECIPE}/recipe.yaml"
          C="customers/${RECIPE}/Containerfile"
          node dist/cli.js compile "$R" > /tmp/Containerfile.fresh

          # D28. The Containerfile is COMMITTED next to the recipe, because the FAQ tells a customer
          # they can rebuild their own operating system with nothing but podman:
          #     git clone .../auros-recipes && podman build -f <name>/Containerfile .
          # That command backs the claim we advertise hardest — if we vanish, you rebuild without us —
          # so it has to actually work, with no Node and no toolchain of ours.
          #
          # A generated file committed to a repo drifts. So CI regenerates it and fails on any
          # difference: a committed artefact that no longer matches its source is a worse lie than no
          # artefact at all. The diff is also genuinely useful to the customer — reading their own
          # Containerfile across two commits is a plain record of what changed on their machines.
          if [ -f "$C" ] && ! diff -u "$C" /tmp/Containerfile.fresh > /tmp/drift.diff; then
            echo "::error::$C has drifted from $R — the committed Containerfile no longer matches the recipe it claims to come from."
            echo "The customer-facing rebuild command uses the COMMITTED file, so a drifted one hands them a different operating system than the one we built."
            cat /tmp/drift.diff
            exit 1
          fi
          cp /tmp/Containerfile.fresh "$C"
          cat "$C"
          sudo podman build -t "localhost/${RECIPE}:candidate" -f "$C" .

      - name: Check matrix — static, then boot, then update
        id: matrix
        run: |
          sudo chmod 666 /dev/kvm || true
          .auros-base/matrix/run/run-static.sh "localhost/${RECIPE}:candidate"
          .auros-base/matrix/run/run-boot.sh   "localhost/${RECIPE}:candidate"
          .auros-base/matrix/run/run-update.sh "localhost/${RECIPE}:candidate"

      - name: Resolve the digest under test
        id: digest
        run: |
          D=$(sudo podman inspect "localhost/${RECIPE}:candidate" --format '{{.Digest}}' 2>/dev/null || true)
          [ -n "$D" ] || D=$(jq -r '.digest // empty' results.json)
          [ -n "$D" ] || { echo "::error::cannot resolve a digest for the candidate image. A pass binds to a digest, never to a tag."; exit 1; }
          echo "digest=$D" >> $GITHUB_OUTPUT

      - name: Publish — gated on the LEDGER, not on our own results file
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          # This step was wrong in an instructive way and tools/gate.test.mjs caught it.
          #
          # It used to run `gate.mjs --require-pass results.json` — gating on a file THIS JOB had just
          # written. That is self-certification: the same code that decides whether the image passed
          # also supplies the evidence. matrix/README.md says it directly — "a field that says pass is
          # exactly what a broken or malicious harness would write" — and this step was reading such a
          # field from a file it produced seconds earlier.
          #
          # The gate's only real question is: does the ATTESTATION LEDGER record a full pass for THIS
          # EXACT DIGEST? So we fetch the ledger from origin, not from this checkout, because a
          # checkout is something a workflow can modify before reading it.
          #
          # HOW THE GATE IS POINTED AT THOSE BYTES, and why it is a file copy rather than a flag:
          # tools/gate.mjs derives every path it reads from ITS OWN location and reads no environment
          # variable and no --ledger flag — deliberately, so that where a process is started and what
          # is in its environment cannot change which ledger decides. An earlier version of this step
          # was written as `AUROS_LEDGER=/tmp/… node …`, which looked like it selected the fetched
          # ledger and in fact selected nothing: the gate read the checkout's own file while the log
          # said otherwise. So we put the origin bytes AT the path the gate derives.
          curl -sfL -o /tmp/passed-digests.tsv \
            https://raw.githubusercontent.com/aarohkandy/auros/main/attest/passed-digests.tsv \
            || { echo "::error::could not fetch the attestation ledger. No ledger, no publish — this fails closed on purpose."; exit 1; }
          cp /tmp/passed-digests.tsv .auros-meta/attest/passed-digests.tsv

          # `.auros-meta` is where the meta/control repo is checked out above. The path used to read
          # `.auros-base/../tools/gate.mjs`, which normalises to `tools/gate.mjs` — a directory this
          # repository does not have. The step died with "Cannot find module" before the gate ever
          # ran. It failed closed, so nothing unsafe published, but the publish path was broken and
          # the log read like an infrastructure error rather than like a refusal.
          # tools/gate.refusals.test.mjs now resolves every gate.mjs path in every workflow and fails
          # if one of them names a file that will not be there.
          if ! node .auros-meta/tools/gate.mjs "$DIGEST" --recipe "$RECIPE"; then
            cat <<MSG
          ::error::REFUSING TO PUBLISH. The ledger has no full pass recorded for $DIGEST.

          This is the correct outcome right now, not a bug in this workflow. Recording a pass means
          writing to attest/passed-digests.tsv in aarohkandy/auros, and a workflow's own GITHUB_TOKEN
          cannot write to another repository (DECISIONS.md D18, BLOCKED.md B2). Until that credential
          exists, a recipe image can be BUILT and fully TESTED here but cannot be published.

          Do not work around this by gating on results.json. That is what this step used to do, and
          it gated the image on evidence the same job produced.
          MSG
            exit 1
          fi

          echo "ledger records a full pass for $DIGEST — publishing"
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman push "localhost/${RECIPE}:candidate" "ghcr.io/aarohkandy/auros-${RECIPE}:latest"

      - name: Record the base digest this recipe was built against
        run: |
          printf 'BASE_DIGEST=%s\nBUILT_AT=%s\nRUN_URL=%s\n' \
            "${BASE_DIGEST}" "$(date -u +%FT%TZ)" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > "customers/${RECIPE}/base.lock"
          git config user.name  'auros-ci'
          git config user.email 'ci@auros.invalid'
          git add "customers/${RECIPE}/base.lock" "customers/${RECIPE}/Containerfile"
          git diff --cached --quiet || git commit -m "ci(${RECIPE}): built against ${BASE_DIGEST}"
          git push || echo "push failed — the poll will retry, so this is not fatal"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ inputs.recipe }}
          path: |
            results.json
            removal-report.json
            customers/${{ inputs.recipe }}/Containerfile
          if-no-files-found: warn
