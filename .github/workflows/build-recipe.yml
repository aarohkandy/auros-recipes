# Build ONE customer recipe. Called by propagate.yml, once per stale recipe.
# Publishes only on a full check-matrix pass — there is no input that bypasses that.
#
# ── PUBLISHING IS MAIN-ONLY, AND THAT IS AN AUTHORISATION GATE ──────────────────────────────────
#
# An order from the website becomes a branch `order/<name>-<date>-<hash>` pushed by our GitHub App,
# and a push authored by a GitHub App DOES start workflow runs — only a workflow's own GITHUB_TOKEN
# is suppressed. So for a while this file was reachable from a stranger's order: propagate.yml had
# no branches filter, fired on the order branch, found customers/<new>/ with no lockfile, called
# this workflow, and the publish step had no ref guard at all. A pull request opened by somebody on
# the internet, with no human review and no merge, built and pushed
# ghcr.io/aarohkandy/auros-<name>:latest into our namespace.
#
# The check matrix did not stop it and was never going to: it is a QUALITY gate, it answers "does
# this image work", and the question being asked was "may this image carry our name". The promise
# repeated in the pull request body, in the configurator panel and on the order page — nothing is
# built until you and we have both read it — was false on the first order.
#
# Two guards now, because they fail differently:
#   * `inputs.publish`, so a caller states its intent and a test-build caller cannot forget to;
#   * `github.ref == 'refs/heads/main'`, which a caller cannot state at all. In a reusable workflow
#     `github.ref` is the CALLER's ref, so this is the fact about where the code came from rather
#     than a parameter anybody can pass.
#
# An order branch is test-built by order-check.yml, which runs the same matrix and stops before the
# push. Review and merge to main is the thing that publishes.
name: build-recipe
on:
  workflow_call:
    inputs:
      recipe:       { required: true,  type: string }
      base_digest:  { required: true,  type: string }
      publish:
        required: false
        type: boolean
        default: true
        description: >-
          Whether this build may publish. False is the safe direction and callers that test-build an
          unreviewed branch must pass it. It is not sufficient on its own: the publish step also
          requires the caller to be on main, which no input can assert.
  workflow_dispatch:
    inputs:
      recipe:       { required: true,  type: string }
      base_digest:  { required: false, type: string, description: 'Leave empty to use the currently published base. There is deliberately no input that skips the check matrix.' }
      publish:
        required: false
        type: boolean
        default: true
        description: 'Publishing also requires this dispatch to be on main. There is still no input that skips the check matrix.'

defaults:
  run:
    shell: bash -euo pipefail {0}

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04     # pinned: ubuntu-latest migrates to 26.04 between 2026-10-19 and 11-19 (D23)
    timeout-minutes: 120
    env:
      # THE RECIPE NAME ARRIVES IN A PULL REQUEST FROM THE INTERNET.
      #
      # `${{ }}` inside a `run:` block is textual substitution performed BEFORE bash sees the script,
      # so every interpolation of an attacker-influenced value is an injection site — a name
      # containing a quote and a semicolon becomes commands. Binding it once to an environment
      # variable here means every step refers to "$RECIPE", which bash treats as data no matter what
      # it contains.
      #
      # The schema constrains the name as well. This is the second layer, because the first one being
      # correct is not something a publish step should have to assume.
      #
      # THE SYNTAX MATTERS AND WAS WRONG HERE. GitHub interpolates `${{ }}` and nothing else, so
      # `RECIPE: ${RECIPE}` set this variable to the nine literal characters `${RECIPE}`. Every step
      # then expanded `$RECIPE` back to that literal, computed customers/${RECIPE}/recipe.yaml, and
      # died on a path that cannot exist -- before validating, compiling or gating anything. The job
      # failed closed, which is why nothing unsafe shipped, but "the validator runs on every build"
      # was false for as long as it was written this way. tools/workflow-lint.mjs now refuses a `${NAME}`
      # in any workflow `env:` value that carries no `${{`.
      RECIPE: ${{ inputs.recipe }}
      BASE_DIGEST: ${{ inputs.base_digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: aarohkandy/auros-base, path: .auros-base }
      # The namespace. `compile` writes the FROM line from auros.config.json and has no literal to
      # fall back on (DECISIONS.md D1), so the control repo has to be here. src/config.ts looks in
      # .auros-meta/ by name. The two repository names on these lines are the bootstrap: a workflow
      # cannot read the namespace file before it has fetched the file that holds it.
      - uses: actions/checkout@v4
        with: { repository: aarohkandy/auros, path: .auros-meta }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: corepack enable && pnpm install --frozen-lockfile

      - name: Validate — a recipe may only ADD
        run: |
          R="customers/${RECIPE}/recipe.yaml"
          echo "::group::validate"
          node dist/cli.js validate "$R"
          echo "::endgroup::"
          # The recipe arrives from the internet and `explain` prints its text at column zero, so a
          # display_name of "::error::Everything passed" was emitted verbatim into the build log and
          # read by Actions as a workflow command: fabricated annotations, ::add-mask:: redacting
          # chosen strings from the operator's log, ::stop-commands:: hiding the real output that
          # follows -- including this gate's. On a product whose argument is that the build output is
          # true, letting the customer write the build output is the wrong bug to have.
          #
          # recipe.schema.json refuses a leading `::` in $defs/line and $defs/prose, so all three
          # validators already do. This is the second layer, because the first one being correct is
          # not something a log should have to assume: everything between the tokens is text, whatever
          # it says. The token is a fresh uuid per run, so nothing in the recipe can spell the resume.
          RESUME="auros-$(uuidgen)"
          echo "::stop-commands::${RESUME}"
          echo "::group::explain (this text becomes the PR body and the customer reads it)"
          node dist/cli.js explain "$R" | tee /tmp/explain.txt
          echo "::endgroup::"
          echo "::${RESUME}::"

      - name: Reclaim disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift 2>/dev/null || true
          sudo docker system prune -af --volumes >/dev/null 2>&1 || true
          df -h /

      - name: Compile, and refuse to proceed if the committed Containerfile has drifted
        id: build
        run: |
          R="customers/${RECIPE}/recipe.yaml"
          C="customers/${RECIPE}/Containerfile"
          node dist/cli.js compile "$R" > /tmp/Containerfile.fresh

          # D28. The Containerfile is COMMITTED next to the recipe, because the FAQ tells a customer
          # they can rebuild their own operating system with nothing but podman:
          #     git clone .../auros-recipes && podman build -f <name>/Containerfile .
          # That command backs the claim we advertise hardest — if we vanish, you rebuild without us —
          # so it has to actually work, with no Node and no toolchain of ours.
          #
          # A generated file committed to a repo drifts. So CI regenerates it and fails on any
          # difference: a committed artefact that no longer matches its source is a worse lie than no
          # artefact at all. The diff is also genuinely useful to the customer — reading their own
          # Containerfile across two commits is a plain record of what changed on their machines.
          if [ -f "$C" ] && ! diff -u "$C" /tmp/Containerfile.fresh > /tmp/drift.diff; then
            echo "::error::$C has drifted from $R — the committed Containerfile no longer matches the recipe it claims to come from."
            echo "The customer-facing rebuild command uses the COMMITTED file, so a drifted one hands them a different operating system than the one we built."
            cat /tmp/drift.diff
            exit 1
          fi
          cp /tmp/Containerfile.fresh "$C"
          cat "$C"
          sudo podman build -t "localhost/${RECIPE}:candidate" -f "$C" .

      # THE PARAMETERS OF THE TEST COME OFF THE ARTIFACT UNDER TEST.
      #
      # This step did not work. It read:
      #
      #     .auros-base/matrix/run/run-static.sh "localhost/${RECIPE}:candidate"
      #     .auros-base/matrix/run/run-boot.sh   "localhost/${RECIPE}:candidate"
      #     .auros-base/matrix/run/run-update.sh "localhost/${RECIPE}:candidate"
      #
      # Every one of those scripts takes named flags and dies on a positional argument. Run by hand
      # against a real image ref, all three answer `FATAL: unknown argument` and exit 2 — so the
      # check matrix on a customer build had never run and could never have run. It failed CLOSED,
      # which is why nothing shipped behind it, but "the matrix gates every recipe" was not true.
      # DECISIONS.md D34's rule, in the other direction: a check that cannot RUN is worth exactly as
      # much as one that cannot fail.
      #
      # The real entry point is matrix/run.sh, which takes --phase, --image, --digest, --out and,
      # for boot, --profile, and writes a JSON fragment per phase. Its own flags are read from
      # `--help`, not remembered.
      #
      # WHERE THE RECIPE-SPECIFIC ARGUMENTS COME FROM. run-static.sh wants the declared removals and
      # the Flatpak refs so S-checks can assert they are absent or present; run-boot.sh wants
      # --locale and --keymap for B4 and --policy for the policy assertions; run-matrix wants the
      # hardware profiles. None of that was being passed either, so even a matrix that started would
      # have tested a customer image as if it were the base.
      #
      # All of it is read BACK OFF THE BUILT IMAGE rather than re-derived from the YAML here: the
      # compiler stamps auros.test-profiles, auros.locale, auros.keymap and auros.policy as labels,
      # and writes the removal plan to /usr/share/auros/prune-plan.json inside the image. The thing
      # under test supplies the parameters of its own test, so a workflow cannot drift from the
      # recipe it is testing — which is the same bug in a different costume.
      - name: Read the test parameters off the built image
        id: params
        run: |
          IMG="localhost/${RECIPE}:candidate"
          label() { sudo podman inspect "$IMG" --format "{{ index .Labels \"$1\" }}"; }
          PROFILES=$(label auros.test-profiles)
          [ -n "$PROFILES" ] || { echo "::error::$IMG carries no auros.test-profiles label, so there is nothing to boot it on. Recompile with a toolchain that stamps it."; exit 1; }
          {
            echo "profiles=${PROFILES}"
            echo "locale=$(label auros.locale)"
            echo "keymap=$(label auros.keymap)"
            echo "policy=$(label auros.policy)"
            echo "budget_bytes=$(( $(label auros.size-budget-gb) * 1024 * 1024 * 1024 ))"
          } >> "$GITHUB_OUTPUT"

          # The recipe's declared removals and Flatpak refs, as repeated flags, from the plan the
          # compiler wrote into the image before the prune ran.
          sudo podman run --rm --entrypoint= "$IMG" cat /usr/share/auros/prune-plan.json > /tmp/plan.json
          jq -r '.planned[].package' /tmp/plan.json | sed 's/^/--remove-pkg /' | tr '\n' ' ' > /tmp/remove.args
          sudo podman run --rm --entrypoint= "$IMG" sh -c 'cat /etc/flatpak/preinstall.d/*.preinstall 2>/dev/null || true' \
            | sed -n 's/^\[Flatpak Preinstall \(.*\)\]$/--flatpak-ref \1/p' | tr '\n' ' ' > /tmp/flatpak.args
          echo "remove:  $(wc -w < /tmp/remove.args) words"
          echo "flatpak: $(cat /tmp/flatpak.args)"

      - name: Check matrix — static, then boot on every declared profile, then update
        id: matrix
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: |
          sudo chmod 666 /dev/kvm || true
          IMG="localhost/${RECIPE}:candidate"
          M=.auros-base/matrix/run.sh
          mkdir -p fragments
          # `read -a` leaves the variable UNSET for an empty file, and `set -u` then kills the job on
          # "${ARR[@]}". The ${ARR[@]+...} form is the one that survives an empty list; a recipe with
          # no Flatpaks is ordinary, not an error.
          declare -a REMOVE_ARGS=() FLATPAK_ARGS=()
          read -r -a REMOVE_ARGS  < /tmp/remove.args  || true
          read -r -a FLATPAK_ARGS < /tmp/flatpak.args || true

          sudo -E "$M" --phase static --image "$IMG" --out fragments/static.json \
            -- --recipe "$RECIPE" --policy '${{ steps.params.outputs.policy }}' \
               --budget-bytes '${{ steps.params.outputs.budget_bytes }}' \
               ${REMOVE_ARGS[@]+"${REMOVE_ARGS[@]}"} ${FLATPAK_ARGS[@]+"${FLATPAK_ARGS[@]}"}

          # One boot job per profile the recipe declared. hardware.also_test is what puts a profile
          # in this list; uefi-modern is always in it because the update group runs there.
          IFS=',' read -r -a PROFILE_LIST <<< '${{ steps.params.outputs.profiles }}'
          for p in "${PROFILE_LIST[@]}"; do
            sudo -E "$M" --phase boot --profile "$p" --image "$IMG" --out "fragments/boot-$p.json" \
              -- --recipe "$RECIPE" --policy '${{ steps.params.outputs.policy }}' \
                 --locale '${{ steps.params.outputs.locale }}' --keymap '${{ steps.params.outputs.keymap }}' \
                 ${FLATPAK_ARGS[@]+"${FLATPAK_ARGS[@]}"}
          done

          # U1-U5 need the PRIVATE half of the key the image ships, or the guest refuses every image
          # and U1 fails for the wrong reason. auros-base/.github/workflows/build.yml says the same.
          if [ -z "${COSIGN_PRIVATE_KEY:-}" ]; then
            echo "::error::COSIGN_PRIVATE_KEY is not set, so U1-U5 cannot run and this digest cannot qualify. See auros-base/signing/keys/README.md."
            exit 1
          fi
          printf '%s' "$COSIGN_PRIVATE_KEY" > /tmp/auros.key && chmod 600 /tmp/auros.key
          rc=0
          sudo -E "$M" --phase update --profile uefi-modern --image "$IMG" --out fragments/update.json \
            -- --recipe "$RECIPE" --policy '${{ steps.params.outputs.policy }}' --signing-key /tmp/auros.key || rc=$?
          shred -u /tmp/auros.key 2>/dev/null || rm -f /tmp/auros.key
          exit $rc

      - name: Resolve the digest under test
        id: digest
        run: |
          D=$(sudo podman inspect "localhost/${RECIPE}:candidate" --format '{{.Digest}}' 2>/dev/null || true)
          [ -n "$D" ] || D=$(jq -r '.digest // empty' results.json)
          [ -n "$D" ] || { echo "::error::cannot resolve a digest for the candidate image. A pass binds to a digest, never to a tag."; exit 1; }
          echo "digest=$D" >> $GITHUB_OUTPUT

      # Same pinned cosign as auros-base, read from the same lock (D17). A recipe image is signed with
      # the base's key because it inherits the base's policy.json — see scripts/sign-recipe.sh.
      - name: Read auros-base/signing/cosign.lock — the only place a cosign version is written
        id: cosign
        if: inputs.publish && github.ref == 'refs/heads/main'
        run: |
          set -a; . .auros-base/signing/cosign.lock; set +a
          : "${COSIGN_VERSION:?auros-base/signing/cosign.lock has no COSIGN_VERSION}"
          echo "version=${COSIGN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "flag=${COSIGN_BUNDLE_FORMAT_FLAG:-}" >> "$GITHUB_OUTPUT"
          echo "pubkey_in_image=${COSIGN_PUBKEY_IN_IMAGE:-}" >> "$GITHUB_OUTPUT"
          # `uses:` cannot be an expression, so the action ref below is written out. This stops it
          # drifting from the lock silently — the same assertion auros-base build.yml makes.
          WANT="sigstore/cosign-installer@v4.1.2"
          if [ "${COSIGN_INSTALLER_ACTION:-$WANT}" != "$WANT" ]; then
            echo "::error::auros-base/signing/cosign.lock names ${COSIGN_INSTALLER_ACTION}, but build-recipe.yml pins ${WANT}. Update the uses: line below to match the lock."
            exit 1
          fi

      - uses: sigstore/cosign-installer@v4.1.2
        if: inputs.publish && github.ref == 'refs/heads/main'
        with:
          cosign-release: ${{ steps.cosign.outputs.version }}

      # THE REF GUARD IS PART OF THE GATE, not a convenience. See the header of this file for what
      # reached this step before it existed. `inputs.publish` is the caller's stated intent;
      # `github.ref` is where the code came from, and a caller cannot assert it.
      - name: Publish — gated on the LEDGER, not on our own results file
        if: inputs.publish && github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          BUNDLE_FLAG: ${{ steps.cosign.outputs.flag }}
          PUBKEY_IN_IMAGE: ${{ steps.cosign.outputs.pubkey_in_image }}
        run: |
          # This step was wrong in an instructive way and tools/gate.test.mjs caught it.
          #
          # It used to run `gate.mjs --require-pass results.json` — gating on a file THIS JOB had just
          # written. That is self-certification: the same code that decides whether the image passed
          # also supplies the evidence. matrix/README.md says it directly — "a field that says pass is
          # exactly what a broken or malicious harness would write" — and this step was reading such a
          # field from a file it produced seconds earlier.
          #
          # The gate's only real question is: does the ATTESTATION LEDGER record a full pass for THIS
          # EXACT DIGEST? So we fetch the ledger from origin, not from this checkout, because a
          # checkout is something a workflow can modify before reading it.
          #
          # HOW THE GATE IS POINTED AT THOSE BYTES, and why it is a file copy rather than a flag:
          # tools/gate.mjs derives every path it reads from ITS OWN location and reads no environment
          # variable and no --ledger flag — deliberately, so that where a process is started and what
          # is in its environment cannot change which ledger decides. An earlier version of this step
          # was written as `AUROS_LEDGER=/tmp/… node …`, which looked like it selected the fetched
          # ledger and in fact selected nothing: the gate read the checkout's own file while the log
          # said otherwise. So we put the origin bytes AT the path the gate derives.
          curl -sfL -o /tmp/passed-digests.tsv \
            https://raw.githubusercontent.com/aarohkandy/auros/main/attest/passed-digests.tsv \
            || { echo "::error::could not fetch the attestation ledger. No ledger, no publish — this fails closed on purpose."; exit 1; }
          cp /tmp/passed-digests.tsv .auros-meta/attest/passed-digests.tsv

          # `.auros-meta` is where the meta/control repo is checked out above. The path used to read
          # `.auros-base/../tools/gate.mjs`, which normalises to `tools/gate.mjs` — a directory this
          # repository does not have. The step died with "Cannot find module" before the gate ever
          # ran. It failed closed, so nothing unsafe published, but the publish path was broken and
          # the log read like an infrastructure error rather than like a refusal.
          # tools/gate.refusals.test.mjs now resolves every gate.mjs path in every workflow and fails
          # if one of them names a file that will not be there.
          # NEGATIVE CONTROL FIRST. The gate must be demonstrated to REFUSE before its allow means
          # anything. For as long as this step called a gate.mjs path that did not exist, the job
          # failed with MODULE_NOT_FOUND and the log read like infrastructure — the gate had never
          # once run here and nothing said so. An all-zeros digest can never have a recorded pass,
          # so the gate must exit exactly 1 on it: 0 means it approves everything, 2 means it cannot
          # decide, and "not found" means it is not there. Same control as auros-base build.yml.
          SENTINEL="sha256:$(printf '0%.0s' $(seq 64))"
          set +e; node .auros-meta/tools/gate.mjs "$SENTINEL" --recipe "$RECIPE" >/dev/null 2>&1; grc=$?; set -e
          if [ "$grc" -ne 1 ]; then
            echo "::error::negative control failed: the gate exited ${grc} on a digest that can never have passed (expected 1). A gate that cannot refuse has not approved anything."
            exit 1
          fi
          echo "negative control: the gate refuses a digest with no recorded pass (exit 1), so its verdict below means something"

          if ! node .auros-meta/tools/gate.mjs "$DIGEST" --recipe "$RECIPE"; then
            cat <<MSG
          ::error::REFUSING TO PUBLISH. The ledger has no full pass recorded for $DIGEST.

          This is the correct outcome right now, not a bug in this workflow. Recording a pass means
          writing to attest/passed-digests.tsv in aarohkandy/auros, and a workflow's own GITHUB_TOKEN
          cannot write to another repository (DECISIONS.md D18, BLOCKED.md B2). Until that credential
          exists, a recipe image can be BUILT and fully TESTED here but cannot be published.

          Do not work around this by gating on results.json. That is what this step used to do, and
          it gated the image on evidence the same job produced.
          MSG
            exit 1
          fi

          echo "ledger records a full pass for $DIGEST — publishing"

          # The image name is DERIVED, never written here. auros.config.json is the single source of
          # truth for the namespace (D1); a literal on this line would mean renaming the company is a
          # grep across five repositories. `--arg` keeps the recipe name data rather than jq program
          # text, the same reason it is bound to $RECIPE above.
          IMAGE=$(jq -r --arg r "$RECIPE" '"\(.registry)/\(.org)/\(.product)-\($r)"' .auros-meta/auros.config.json)
          REGISTRY=$(jq -r .registry .auros-meta/auros.config.json)
          echo "${{ github.token }}" | sudo podman login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

          # SIGNING PREFLIGHT, BEFORE ANYTHING REACHES THE REGISTRY. Refuses a development-key image,
          # a missing COSIGN_PRIVATE_KEY, or a key that does not match the public key inside the
          # image. The push below lands in a namespace whose policy requires a signature; an unsigned
          # recipe image there is refused by every machine, forever, silently (SYSTEM-REVIEW §2.1).
          export CANDIDATE="localhost/${RECIPE}:candidate"
          scripts/sign-recipe.sh preflight

          # PUBLISH THE DIGEST THE GATE CLEARED, not "whatever is under that local tag now".
          # `podman push <tag> <dest>` re-uploads the bytes the tag points at, and the thing the
          # ledger cleared is a digest. They are the same today and there is no step between them
          # that could make them differ -- but "there is no step between them" is a property of this
          # file that a later edit silently removes, so it is asserted instead of assumed.
          sudo podman push --digestfile /tmp/pushed.digest "localhost/${RECIPE}:candidate" "docker://${IMAGE}:latest"
          PUSHED=$(cat /tmp/pushed.digest)
          if [ "$PUSHED" != "$DIGEST" ]; then
            echo "::error::published $PUSHED but the ledger cleared $DIGEST. The bytes that reached the registry are not the bytes that were tested."
            exit 1
          fi
          echo "published ${IMAGE}:latest at $PUSHED — the digest the ledger cleared"

          # SIGN WHAT WAS PUSHED, then assert it verifies against the image's own public key and that
          # the .sig tag is discoverable (auros-base S8). cosign and skopeo run as the runner user and
          # the login above was root's, so they log in for themselves.
          echo "${{ github.token }}" | cosign login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          echo "${{ github.token }}" | skopeo login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          IMAGE="$IMAGE" scripts/sign-recipe.sh sign

      # THE LOCKFILE LIVES OUTSIDE customers/, AND THAT IS A SECURITY BOUNDARY, NOT TIDINESS.
      #
      # It used to be customers/<name>/base.lock -- the inside of a pull request from a stranger.
      # Two lines added beside recipe.yaml did two things at once: compile.ts read the digest from it
      # and pinned that fleet's FROM to an image of the author's choosing, and the staleness test in
      # propagate.yml (`grep -qF "$DIGEST" "$lock"`) saw the currently published digest in the file
      # and marked the fleet permanently up to date. Never rebuilt, never patched, still booting.
      # That is the abandoned machine this product exists to replace, manufactured by us.
      #
      # .locks/ is written only here. .github/workflows/pull-request.yml refuses any pull request
      # that touches it, and src/validate.ts refuses any file in a recipe folder that is not the
      # recipe, its Containerfile, removal-floor.lock or the logo the recipe names.
      # Same guard, and for a related reason rather than the same one. The lockfile is what
      # propagate.yml reads to decide a recipe is current, so writing one from an unreviewed branch
      # would mark that fleet up to date against a build nobody published — permanently not-stale,
      # never rebuilt, never patched. It is also a commit and a push, and a build triggered by a
      # stranger's order does not get to write to the repository.
      - name: Record the base digest this recipe was built against
        if: inputs.publish && github.ref == 'refs/heads/main'
        run: |
          mkdir -p .locks
          printf 'BASE_DIGEST=%s\nBUILT_AT=%s\nRUN_URL=%s\n' \
            "${BASE_DIGEST}" "$(date -u +%FT%TZ)" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > ".locks/${RECIPE}.lock"
          git config user.name  'auros-ci'
          git config user.email 'ci@auros.invalid'
          git add ".locks/${RECIPE}.lock" "customers/${RECIPE}/Containerfile"
          git diff --cached --quiet || git commit -m "ci(${RECIPE}): built against ${BASE_DIGEST}"
          git push || echo "push failed — the poll will retry, so this is not fatal"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ inputs.recipe }}
          path: |
            results.json
            removal-report.json
            customers/${{ inputs.recipe }}/Containerfile
          if-no-files-found: warn
