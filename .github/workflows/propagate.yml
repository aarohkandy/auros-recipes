# GATE 2 PROPAGATION — how a base change reaches every customer image with no human action.
#
# Spec §3: "CVE response is one rebuild. Base rebuilds -> all children rebuild -> all machines update on
# next boot." This workflow is the middle arrow.
#
# There are two paths here, and the honest situation is that the good one needs a credential we do not
# have yet:
#
#   1. repository_dispatch (instant).  auros-base fires this the moment it publishes. It requires a PAT
#      or GitHub App token, because a workflow's default GITHUB_TOKEN is issued FOR ITS OWN REPOSITORY
#      and cannot authenticate POST /repos/{other}/{repo}/dispatches (DECISIONS.md D18). Note the reason
#      is NOT the commonly-cited recursion rule — the docs explicitly exempt repository_dispatch.
#
#   2. schedule (polling fallback).  Works with no secret at all. Every run re-resolves the published
#      base digest and compares it to each recipe's lockfile; anything stale rebuilds.
#
# Path 2 exists so that propagation is never blocked on a credential. See BLOCKED.md B2 and B7.
name: propagate
on:
  repository_dispatch:
    types: [base-published]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  # `branches: [main]` IS A SECURITY BOUNDARY, not tidiness.
  #
  # An order from the website is a branch `order/<name>-<date>-<hash>` pushed into this repository by
  # our GitHub App, and a push authored by a GitHub App starts workflow runs -- only a workflow's own
  # GITHUB_TOKEN is suppressed. Without this filter, that push matched `paths: customers/**`, detect
  # found the new folder with no lockfile and called it stale, and rebuild called build-recipe.yml on
  # the order branch. A stranger's unreviewed pull request built and published an image into our
  # namespace, and the only thing between an anonymous POST and ghcr.io/aarohkandy/auros-<name>:latest
  # was the check matrix -- which is a quality gate, not an authorisation gate.
  #
  # Order branches are test-built by order-check.yml, which runs the same matrix and stops before the
  # push. Propagation is about what is merged.
  push:
    branches: [main]
    paths: ['customers/**', 'schema/**', 'src/**']

defaults:
  run:
    shell: bash -euo pipefail {0}

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  detect:
    runs-on: ubuntu-24.04     # D23: ubuntu-latest moves to 26.04 from 2026-10-19
    outputs:
      stale: ${{ steps.scan.outputs.stale }}
      base_digest: ${{ steps.scan.outputs.base_digest }}
      reason: ${{ steps.scan.outputs.reason }}
      repin: ${{ steps.scan.outputs.repin }}
    steps:
      - uses: actions/checkout@v4
      # The namespace (D1). scripts/resolve-base.mjs reads the base reference from auros.config.json
      # via src/config.ts, which looks in .auros-meta/ by name — no image name is written here.
      - uses: actions/checkout@v4
        with: { repository: aarohkandy/auros, path: .auros-meta }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Resolve the published base digest
        id: scan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Fails closed (SYSTEM-REVIEW §2.5). The ONLY green failure is the registry saying "manifest
          # unknown" to an authenticated request; auth errors, outages, rate limits and a missing
          # skopeo exit non-zero here and turn this run red. Branches are tested in
          # test/resolve-base.test.ts.
          RESOLVED=$(node scripts/resolve-base.mjs)
          if [ "$RESOLVED" = "status=not-published" ]; then
            echo "base not published yet (registry: manifest unknown) — nothing to propagate"
            echo "stale=[]" >> $GITHUB_OUTPUT; echo "base_digest=" >> $GITHUB_OUTPUT
            echo "reason=base-not-published" >> $GITHUB_OUTPUT; exit 0
          fi
          DIGEST=$(printf '%s\n' "$RESOLVED" | sed -n 's/^digest=//p')
          [ -n "$DIGEST" ] || { echo "resolve-base printed no digest: $RESOLVED"; exit 1; }
          echo "published base digest: $DIGEST"
          echo "base_digest=$DIGEST" >> $GITHUB_OUTPUT

          # The pin every Containerfile is compiled against is a COMMITTED file (SYSTEM-REVIEW §2.11).
          # When it is not the published digest, the repin job below commits the new pin together with
          # the regenerated Containerfiles, and nothing is built this run: a build from this checkout
          # would be on the old pin. The next poll builds from the repinned commit.
          if [ "$(cat .locks/base.digest 2>/dev/null || true)" != "$DIGEST" ]; then
            echo "base moved to $DIGEST — repinning; rebuilds follow on the next poll"
            echo "repin=true" >> $GITHUB_OUTPUT
            echo "stale=[]" >> $GITHUB_OUTPUT; echo "reason=repin" >> $GITHUB_OUTPUT; exit 0
          fi

          # A recipe is stale when its lockfile does not name the digest currently published.
          # Missing lockfile counts as stale: a recipe that has never been built is not up to date.
          STALE=()
          for d in customers/*/; do
            [ -d "$d" ] || continue
            name=$(basename "$d")
            lock=".locks/$name.lock"
            # .locks/ is written only by build-recipe.yml and is refused in a pull request, so a
            # stranger cannot declare their own fleet up to date and stop receiving CVE rebuilds.
            # It used to be customers/<name>/base.lock, inside the diff the stranger controls.
            if [ ! -f "$lock" ]; then STALE+=("$name"); continue; fi
            if ! grep -qF "$DIGEST" "$lock"; then STALE+=("$name"); fi
          done
          if [ ${#STALE[@]} -eq 0 ]; then
            echo "all recipes current"
            echo "stale=[]" >> $GITHUB_OUTPUT; echo "reason=all-current" >> $GITHUB_OUTPUT
          else
            printf 'stale: %s\n' "${STALE[*]}"
            echo "stale=$(printf '%s\n' "${STALE[@]}" | jq -R . | jq -sc .)" >> $GITHUB_OUTPUT
            echo "reason=${{ github.event_name }}" >> $GITHUB_OUTPUT
          fi
          {
            echo "## propagation"
            echo "- trigger: \`${{ github.event_name }}\`"
            echo "- published base: \`$DIGEST\`"
            echo "- stale recipes: ${#STALE[@]}"
          } >> $GITHUB_STEP_SUMMARY

  rebuild:
    needs: detect
    if: needs.detect.outputs.stale != '[]' && needs.detect.outputs.stale != ''
    strategy:
      fail-fast: false          # one customer's failure must not stop another customer's patch
      matrix:
        recipe: ${{ fromJSON(needs.detect.outputs.stale) }}
    uses: ./.github/workflows/build-recipe.yml
    with:
      recipe: ${{ matrix.recipe }}
      base_digest: ${{ needs.detect.outputs.base_digest }}
    secrets: inherit

  # ONE COMMIT: the new pin and every Containerfile compiled against it. Committing them together is
  # what keeps both promises: the committed Containerfile carries a digest (a customer rebuilding
  # without us gets the exact base), and CI's D28 drift check regenerates the same bytes from the
  # same committed files. A failed push is red on purpose; the next poll retries from scratch.
  repin:
    needs: detect
    if: needs.detect.outputs.repin == 'true'
    runs-on: ubuntu-24.04     # pinned (D23)
    env:
      DIGEST: ${{ needs.detect.outputs.base_digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: aarohkandy/auros, path: .auros-meta }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: Pin the published base and regenerate every Containerfile
        run: |
          mkdir -p .locks
          printf '%s\n' "$DIGEST" > .locks/base.digest
          # compile refuses a pin that is not exactly one digest, so a bad value stops here.
          for r in customers/*/recipe.yaml; do
            node dist/cli.js compile "$r" -o "$(dirname "$r")/Containerfile"
          done
          git config user.name  'auros-ci'
          git config user.email 'ci@auros.invalid'
          git add .locks/base.digest customers/*/Containerfile
          git commit -m "base: pin ${DIGEST}, regenerate every Containerfile"
          git push
